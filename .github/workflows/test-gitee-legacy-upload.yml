name: Test Gitee legacy upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gitee-legacy-upload
  cancel-in-progress: false

jobs:
  legacy-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Test old curl upload once
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          TAG = "v3.2.1"
          NAME = "AppCloner_v3.2.1_macOS.dmg"
          GH = "https://api.github.com/repos/gitsethub/appcloner"
          GITEE = "https://gitee.com/api/v5/repos/gitsethub/appcloner"
          MARKER = b"\nLEGACY_UPLOAD_METRICS "

          class SafeError(Exception):
              pass

          def log(message):
              print(message, flush=True)

          def api(base, path, token=None):
              url = base + path
              if token is not None:
                  url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"access_token": token})
              request = urllib.request.Request(url, headers={"User-Agent": "gitee-legacy-upload-test", "Accept": "application/json"})
              started = time.monotonic()
              log("GET started path=" + path)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  raise SafeError("GET failed http_code={} details=redacted".format(status)) from None
              except Exception:
                  raise SafeError("GET failed details=redacted") from None
              log("GET completed elapsed={:.1f}s".format(time.monotonic() - started))
              return result

          def attachments(release_id, token):
              result = []
              for page in range(1, 101):
                  batch = api(GITEE, "/releases/{}/attach_files?per_page=100&page={}".format(release_id, page), token)
                  if not isinstance(batch, list):
                      raise SafeError("Invalid attachment list; upload not attempted")
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise SafeError("Attachment pagination limit; upload not attempted")

          def ensure_absent(items):
              if any(item.get("name") == NAME for item in items):
                  raise SafeError("NOT_TESTED: same-name attachment exists; stopped without uploading")

          def download(asset, path):
              expected = asset.get("size")
              url = asset.get("browser_download_url", "")
              if type(expected) is not int or expected <= 0 or url != "https://github.com/gitsethub/appcloner/releases/download/" + TAG + "/" + NAME:
                  raise SafeError("Invalid GitHub source asset")
              started = reported = time.monotonic()
              received = 0
              log("download started name={} size={}".format(NAME, expected))
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "gitee-legacy-upload-test"})
                  with urllib.request.urlopen(request, timeout=60) as response, path.open("wb") as output:
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          output.write(block)
                          received += len(block)
                          now = time.monotonic()
                          if now - reported >= 15:
                              log("download running received={} elapsed={:.1f}s".format(received, now - started))
                              reported = now
              except Exception:
                  raise SafeError("download failed details=redacted") from None
              if received != expected:
                  raise SafeError("download size mismatch")
              log("download completed size={} elapsed={:.1f}s".format(received, time.monotonic() - started))

          def upload(path, token, url):
              command = ["curl", "--silent", "--show-error", "--fail",
                         "--connect-timeout", "30", "--max-time", "900",
                         "--form", "file=@" + str(path), "--form", "access_token=<-",
                         "--write-out", "\nLEGACY_UPLOAD_METRICS %{time_total} %{size_upload} %{speed_upload} %{http_code}", url]
              started = time.monotonic()
              log("upload started name={} size={} attempts=1".format(path.name, path.stat().st_size))
              with tempfile.TemporaryFile() as output, tempfile.TemporaryFile() as errors:
                  process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=output, stderr=errors)
                  try:
                      process.stdin.write(token.encode())
                      process.stdin.close()
                      while True:
                          try:
                              code = process.wait(timeout=15)
                              break
                          except subprocess.TimeoutExpired:
                              log("upload running elapsed={:.1f}s; transfer metrics available on exit".format(time.monotonic() - started))
                  finally:
                      if process.poll() is None:
                          process.kill()
                      process.wait()
                  output.seek(0)
                  raw = output.read()
              body, separator, metrics = raw.rpartition(MARKER)
              values = metrics.decode("ascii", errors="replace").strip().split()
              valid = bool(separator) and len(values) == 4 and all(re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", value) for value in values[:3]) and bool(re.fullmatch(r"[0-9]{3}", values[3]))
              duration, size, speed, status = values if valid else ("unavailable", "unavailable", "unavailable", "000")
              log("upload completed elapsed={:.3f}s time_total={} size_upload={} speed_upload={} http_code={} exit_code={}".format(time.monotonic() - started, duration, size, speed, status, code))
              if code != 0 or not valid or not 200 <= int(status) < 300:
                  raise SafeError("upload failed; no retry; response/stderr redacted; inspect existing attachment before any future attempt")
              try:
                  result = json.loads(body)
              except Exception:
                  raise SafeError("upload response invalid; no retry; details=redacted") from None
              if not isinstance(result, dict) or type(result.get("id")) is not int:
                  raise SafeError("upload response missing attachment id; no retry")
              return result

          def main():
              token = os.environ.get("GITEE_TOKEN", "")
              if not token:
                  raise SafeError("Missing GITEE_TOKEN; upload not attempted")
              source = api(GH, "/releases/tags/" + TAG)
              assets = [item for item in source.get("assets", []) if item.get("name") == NAME]
              if source.get("tag_name") != TAG or len(assets) != 1:
                  raise SafeError("GitHub source asset missing or ambiguous")
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / NAME
              download(assets[0], path)
              release = api(GITEE, "/releases/tags/" + TAG, token)
              if release.get("tag_name") != TAG or type(release.get("id")) is not int:
                  raise SafeError("Existing Gitee release missing or invalid; no release created")
              release_id = release["id"]
              log("existing release id={}".format(release_id))
              ensure_absent(release.get("assets", []))
              ensure_absent(attachments(release_id, token))
              result = upload(path, token, GITEE + "/releases/{}/attach_files".format(release_id))
              found = [item for item in attachments(release_id, token) if item.get("name") == NAME and item.get("id") == result["id"]]
              if len(found) != 1:
                  raise SafeError("Post-upload GET missing matching attachment; no retry")
              actual = found[0].get("size")
              log("post-upload GET attachment_id={} size={} expected_size={}".format(result["id"], actual if type(actual) is int else "unavailable", path.stat().st_size))
              if type(actual) is not int or actual != path.stat().st_size:
                  raise SafeError("Post-upload GET size unavailable or mismatch; success not established; no retry")
              log("SUCCESS: one legacy upload verified by GET id and size")

          if __name__ == "__main__":
              try:
                  main()
              except SafeError as error:
                  log(str(error))
                  raise SystemExit(1)
              except Exception:
                  log("FAILED: unexpected error details=redacted; no retry")
                  raise SystemExit(1)
          PY
