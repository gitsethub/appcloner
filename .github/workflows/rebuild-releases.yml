name: Rebuild releases

run-name: Rebuild releases (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "首次选 reset；失败后选 resume，避免再次清空"
        required: true
        type: choice
        options:
          - resume
          - reset
      confirmation:
        description: "确认已保存准备包，输入 REBUILD"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: rebuild-all-releases
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GL_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
      GE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Prepare source list and target snapshots
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          command -v python3

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          if os.environ["CONFIRMATION"] != "REBUILD":
              raise SystemExit("确认文字不正确，未执行任何删除")

          if os.environ["MODE"] not in ("reset", "resume"):
              raise SystemExit("运行模式不正确")

          root = pathlib.Path("snapshot")
          root.mkdir()

          def gh(*args):
              result = subprocess.run(
                  ["gh", *args], capture_output=True, text=True, timeout=120
              )
              if result.returncode:
                  raise RuntimeError("GitHub 查询失败，请检查权限或网络")
              return json.loads(result.stdout)

          repo = os.environ["GH_REPO"]
          workflow = gh(
              "api", f"repos/{repo}/actions/workflows/sync-releases.yml"
          )
          if workflow["state"] != "active":
              raise RuntimeError("请先启用 Sync releases 工作流")

          runs = gh(
              "api",
              f"repos/{repo}/actions/workflows/sync-releases.yml/runs?per_page=100",
          )
          if any(item["status"] != "completed" for item in runs["workflow_runs"]):
              raise RuntimeError("Sync releases 仍有运行或排队任务，请先等待或取消")

          releases = []
          page = 1
          while True:
              batch = gh(
                  "api", f"repos/{repo}/releases?per_page=100&page={page}"
              )
              releases.extend(item for item in batch if not item["draft"])
              if len(batch) < 100:
                  break
              page += 1

          if not releases:
              raise RuntimeError("GitHub 没有已发布版本，禁止清空")

          releases.sort(key=lambda item: item["published_at"] or item["created_at"])
          (root / "github.json").write_text(
              json.dumps(releases, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          targets = {
              "GitLab": "https://gitlab.com/api/v4/projects/gitsethub%2Fappcloner",
              "Gitee": "https://gitee.com/api/v5/repos/gitsethub/appcloner",
          }

          for platform, base in targets.items():
              token = os.environ["GL_TOKEN" if platform == "GitLab" else "GE_TOKEN"]
              if not token:
                  raise RuntimeError(f"{platform} 令牌为空")
              items = []
              page = 1
              while True:
                  url = f"{base}/releases?per_page=100&page={page}"
                  headers = {"User-Agent": "AppCloner-release-rebuild"}
                  if platform == "GitLab":
                      headers["PRIVATE-TOKEN"] = token
                  else:
                      headers["Authorization"] = f"Bearer {token}"
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          batch = json.load(response)
                  except Exception:
                      raise RuntimeError(f"{platform} 清单读取失败，尚未删除") from None
                  if not isinstance(batch, list):
                      raise RuntimeError(f"{platform} 返回格式异常")
                  items.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              (root / f"{platform}.json").write_text(
                  json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print(f"{platform} 当前发行版：{len(items)} 个")

          print(f"本次准备恢复 GitHub 发行版：{len(releases)} 个")
          PY

      - name: Save metadata before deletion
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-before-rebuild
          path: snapshot/
          retention-days: 30
          if-no-files-found: error

      - name: Reset target releases and restore sequentially
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          root = pathlib.Path("snapshot")
          repo = os.environ["GH_REPO"]
          workflow = "sync-releases.yml"

          def gh(*args):
              result = subprocess.run(
                  ["gh", *args], capture_output=True, text=True, timeout=120
              )
              if result.returncode:
                  raise RuntimeError("GitHub 操作失败；停止执行，修复后使用 resume")
              return result.stdout

          def runs():
              return json.loads(gh(
                  "api",
                  f"repos/{repo}/actions/workflows/{workflow}/runs"
                  "?event=workflow_dispatch&per_page=100",
              ))["workflow_runs"]

          # reset 只删除 Release 记录，不删除 Tag、分支或 Package Registry。
          if os.environ["MODE"] == "reset":
              for platform in ("GitLab", "Gitee"):
                  items = json.loads((root / f"{platform}.json").read_text())
                  token = os.environ[
                      "GL_TOKEN" if platform == "GitLab" else "GE_TOKEN"
                  ]
                  for item in items:
                      headers = {"User-Agent": "AppCloner-release-rebuild"}
                      if platform == "GitLab":
                          tag = urllib.parse.quote(item["tag_name"], safe="")
                          url = (
                              "https://gitlab.com/api/v4/projects/"
                              f"gitsethub%2Fappcloner/releases/{tag}"
                          )
                          headers["PRIVATE-TOKEN"] = token
                      else:
                          url = (
                              "https://gitee.com/api/v5/repos/gitsethub/appcloner/"
                              f"releases/{item['id']}"
                          )
                          headers["Authorization"] = f"Bearer {token}"
                      request = urllib.request.Request(
                          url, headers=headers, method="DELETE"
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=120):
                              pass
                      except Exception:
                          raise RuntimeError(
                              f"{platform} 删除失败：{item['tag_name']}。"
                              "请检查目标列表，不要盲目重跑 reset。"
                          ) from None
                      print(
                          f"已删除 {platform} Release：{item['tag_name']}",
                          flush=True,
                      )

          releases = json.loads((root / "github.json").read_text())
          completed = []

          # 逐个调用已测试成功的单版本同步任务，前一个成功后才处理下一个。
          for release in releases:
              tag = release["tag_name"]
              previous_ids = {item["id"] for item in runs()}
              gh(
                  "workflow", "run", workflow,
                  "--repo", repo, "--ref", "main",
                  "-f", f"tag={tag}",
              )
              print(f"已启动同步：{tag}", flush=True)

              run_id = None
              for attempt in range(60):
                  candidates = [
                      item for item in runs()
                      if item["id"] not in previous_ids
                  ]
                  if len(candidates) > 1:
                      raise RuntimeError(
                          "检测到其他手动同步任务，无法安全判断运行编号，请停止并检查"
                      )
                  if candidates:
                      run_id = candidates[0]["id"]
                      break
                  time.sleep(5)

              if run_id is None:
                  raise RuntimeError(
                      f"未找到 {tag} 的运行记录，请检查 Actions 后再决定是否 resume"
                  )

              url = f"https://github.com/{repo}/actions/runs/{run_id}"
              print(url, flush=True)

              for attempt in range(180):
                  current = json.loads(gh(
                      "api", f"repos/{repo}/actions/runs/{run_id}"
                  ))
                  if current["status"] == "completed":
                      if current["conclusion"] != "success":
                          raise RuntimeError(
                              f"{tag} 同步失败，请先查看 {url}，"
                              "修复原因后使用 resume，不要再次 reset"
                          )
                      completed.append(tag)
                      with open(
                          os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"
                      ) as stream:
                          stream.write(f"- ✅ {tag}：[同步记录]({url})\n")
                      print(f"已完成：{tag}", flush=True)
                      break
                  time.sleep(5)
              else:
                  raise RuntimeError(
                      f"{tag} 等待超时，请先检查 {url} 是否仍在运行"
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(
                  f"\n本轮 {len(completed)} 个版本的同步任务全部成功。"
                  "请继续检查两边发行版列表和匿名下载。\n"
              )
          PY
