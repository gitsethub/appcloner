          assets = release["assets"]
          for asset in assets:
              filename = asset["name"]
              if filename in (".", "..") or "/" in filename or "\\" in filename:
                  raise RuntimeError("Unsupported attachment filename")
              path = pathlib.Path("assets") / filename
              if path.stat().st_size != asset["size"]:
                  raise RuntimeError("Downloaded attachment size mismatch")
              digest = asset.get("digest")
              if digest and digest.startswith("sha256:"):
