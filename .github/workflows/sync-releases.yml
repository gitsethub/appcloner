name: Sync releases

on:
  release:
    types: [published, edited, prereleased, released, created, deleted, unpublished]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 输入 REBUILD 按 Gitee、GitLab 逐站清空并重建全部 Release 和 Tag，前站失败则停止
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Sync event release or rebuild mirrors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          BEGIN = "<!-- release-mirror-downloads:start -->"
          END = "<!-- release-mirror-downloads:end -->"
          PROJECT = "gitsethub/appcloner"
          CHUNK = 1024 * 1024
          PACKAGE_NAMES = {"appcloner", "release-mirror"}

          class MirrorError(Exception):
              pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def quote(value):
              return urllib.parse.quote(str(value), safe="")

          def checked_url(url):
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != "https" or not parsed.hostname or parsed.username
                      or parsed.password or parsed.fragment or "\\" in url
                      or any(ord(c) < 33 or ord(c) == 127 for c in url)):
                  raise MirrorError("Unsafe URL")
              return parsed

          def origin(url):
              parsed = checked_url(url)
              return parsed.scheme, parsed.hostname, parsed.port or 443

          def chunks(path):
              with path.open("rb") as stream:
                  while True:
                      block = stream.read(CHUNK)
                      if not block:
                          break
                      yield block

          def strip_downloads(body):
              if body.count(BEGIN) != body.count(END) or body.count(BEGIN) > 1:
                  raise MirrorError("Malformed download section")
              if BEGIN in body:
                  start, finish = body.index(BEGIN), body.index(END)
                  if finish < start:
                      raise MirrorError("Malformed download section")
                  body = body[:start] + body[finish + len(END):]
              return body.rstrip()

          def render_body(body, assets, urls):
              body = strip_downloads(body or "")
              if not assets:
                  return body
              for asset in sorted(assets, key=lambda item: len(item["browser_download_url"]), reverse=True):
                  body = body.replace(asset["browser_download_url"], urls[asset["name"]])
              lines = [BEGIN, "## 下载", ""]
              for asset in assets:
                  name = asset["name"]
                  label = name.replace("\\", "\\\\").replace("[", "\\[").replace("]", "\\]")
                  lines.append("- [{}](<{}>)".format(label, urls[name]))
              return ((body + "\n\n") if body else "") + "\n".join(lines + [END])

          class Client:
              def __init__(self, platform, token, repo=None):
                  self.platform = platform
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())
                  if platform == "GitHub":
                      self.base = "https://api.github.com/repos/" + repo
                  elif platform == "GitLab":
                      self.base = "https://gitlab.com/api/v4/projects/" + quote(PROJECT)
                  else:
                      self.base = "https://gitee.com/api/v5/repos/" + PROJECT

              def open(self, method, url, data=None, headers=None, missing=False):
                  checked_url(url)
                  request = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
                  for attempt in range(3):
                      try:
                          return self.opener.open(request, timeout=180)
                      except urllib.error.HTTPError as error:
                          status = error.code
                          error.close()
                          if missing and status == 404:
                              return None
                          if method in ("GET", "HEAD") and status in (429, 500, 502, 503, 504) and attempt < 2:
                              time.sleep(2 ** attempt)
                              continue
                          raise MirrorError("HTTP request failed") from None
                      except (urllib.error.URLError, OSError, TimeoutError):
                          raise MirrorError("Network request failed") from None

              def auth(self, method, url, data=None):
                  if origin(url) != origin(self.base):
                      raise MirrorError("Cross-origin credential use")
                  headers = {"User-Agent": "release-mirror", "Accept": "application/json"}
                  if self.platform == "GitHub":
                      headers["Authorization"] = "Bearer " + self.token
                      headers["X-GitHub-Api-Version"] = "2022-11-28"
                  elif self.platform == "GitLab":
                      headers["PRIVATE-TOKEN"] = self.token
                  elif method in ("GET", "HEAD"):
                      url += ("&" if "?" in url else "?") + urllib.parse.urlencode({"access_token": self.token})
                  else:
                      data = dict(data or {}, access_token=self.token)
                  return url, headers, data

              def api(self, method, path, data=None, missing=False):
                  url, headers, data = self.auth(method, self.base + path, data)
                  if data is not None:
                      if self.platform == "Gitee":
                          data = urllib.parse.urlencode(data).encode()
                          headers["Content-Type"] = "application/x-www-form-urlencoded"
                      else:
                          data = json.dumps(data).encode()
                          headers["Content-Type"] = "application/json"
                  response = self.open(method, url, data, headers, missing)
                  if response is None:
                      return None
                  with response:
                      raw = response.read()
                  return json.loads(raw) if raw else None

              def pages(self, path):
                  result = []
                  page = 1
                  while True:
                      separator = "&" if "?" in path else "?"
                      batch = self.api("GET", path + separator + "per_page=100&page=" + str(page))
                      if not isinstance(batch, list):
                          raise MirrorError("Invalid pagination response")
                      result.extend(batch)
                      if len(batch) < 100:
                          return result
                      page += 1

              def download(self, url, path):
                  url, headers, unused = self.auth("GET", url)
                  headers["Accept"] = "application/octet-stream"
                  for redirect in range(6):
                      checked_url(url)
                      try:
                          response = self.opener.open(urllib.request.Request(url, headers=headers), timeout=180)
                      except urllib.error.HTTPError as error:
                          status, location = error.code, error.headers.get("Location")
                          error.close()
                          if status not in (301, 302, 303, 307, 308) or not location:
                              raise MirrorError("Download failed") from None
                          url = urllib.parse.urljoin(url, location)
                          checked_url(url)
                          headers = {"User-Agent": "release-mirror", "Accept": "application/octet-stream"}
                          continue
                      except (urllib.error.URLError, OSError, TimeoutError):
                          raise MirrorError("Download failed") from None
                      with response, path.open("wb") as output:
                          while True:
                              block = response.read(CHUNK)
                              if not block:
                                  break
                              output.write(block)
                      return
                  raise MirrorError("Too many redirects")

              def upload(self, path, endpoint):
                  url = self.base + endpoint
                  if self.platform == "GitLab":
                      url, headers, unused = self.auth("PUT", url)
                      headers.update({"Content-Type": "application/octet-stream", "Content-Length": str(path.stat().st_size)})
                      response = self.open("PUT", url, chunks(path), headers)
                  else:
                      boundary = uuid.uuid4().hex
                      filename = path.name.replace('"', "%22")
                      prefix = (
                          "--" + boundary + '\r\nContent-Disposition: form-data; name="access_token"\r\n\r\n'
                          + self.token + "\r\n--" + boundary
                          + '\r\nContent-Disposition: form-data; name="file"; filename="'
                          + filename + '"\r\nContent-Type: application/octet-stream\r\n\r\n'
                      ).encode()
                      suffix = ("\r\n--" + boundary + "--\r\n").encode()
                      def multipart():
                          yield prefix
                          yield from chunks(path)
                          yield suffix
                      headers = {
                          "User-Agent": "release-mirror",
                          "Content-Type": "multipart/form-data; boundary=" + boundary,
                          "Content-Length": str(len(prefix) + path.stat().st_size + len(suffix)),
                      }
                      response = self.open("POST", url, multipart(), headers)
                  with response:
                      raw = response.read()
                  return json.loads(raw) if raw else None

          def validate_releases(releases):
              tags, ids = set(), set()
              for release in releases:
                  tag = release["tag_name"]
                  if not isinstance(tag, str) or not tag or tag in tags:
                      raise MirrorError("Invalid or duplicate tag")
                  tags.add(tag)
                  names = set()
                  for asset in release["assets"]:
                      name = asset["name"]
                      if (not isinstance(name, str) or not name or name in (".", "..")
                              or any(c in name for c in '/\\') or name in names
                              or any(ord(c) < 32 or ord(c) == 127 for c in name)):
                          raise MirrorError("Unsafe or duplicate filename")
                      if (type(asset.get("id")) is not int or asset["id"] <= 0 or asset["id"] in ids
                              or asset.get("state") != "uploaded" or type(asset.get("size")) is not int
                              or asset["size"] < 0):
                          raise MirrorError("Invalid source asset")
                      if origin(asset["browser_download_url"]) != ("https", "github.com", 443):
                          raise MirrorError("Unexpected source URL")
                      names.add(name)
                      ids.add(asset["id"])
                  strip_downloads(release.get("body") or "")

          def snapshot(github):
              releases = [r for r in github.pages("/releases") if not r.get("draft")]
              for release in releases:
                  release["assets"] = github.pages("/releases/{}/assets".format(quote(release["id"])))
              validate_releases(releases)
              return releases

          class AssetCache:
              def __init__(self, github, directory):
                  self.github, self.directory, self.paths = github, directory, {}

              def path(self, asset):
                  key = asset["id"]
                  if key not in self.paths:
                      folder = self.directory / str(key)
                      folder.mkdir()
                      path = folder / asset["name"]
                      self.github.download(self.github.base + "/releases/assets/" + quote(key), path)
                      if path.stat().st_size != asset["size"]:
                          raise MirrorError("Source asset size mismatch")
                      self.paths[key] = path
                  return self.paths[key]

          def git(args, directory, username, token, askpass):
              env = {key: value for key, value in os.environ.items()
                     if not key.startswith(("GIT_", "GCM_"))}
              env.update({"GIT_ASKPASS": str(askpass), "GIT_TERMINAL_PROMPT": "0",
                          "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null",
                          "SYNC_USERNAME": username, "SYNC_TOKEN": token})
              result = subprocess.run(
                  ["git", "-c", "credential.helper=", "-c", "core.hooksPath=/dev/null"] + args,
                  cwd=directory, env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=1800, check=False)
              if result.returncode:
                  raise MirrorError("Git operation failed")
              return result.stdout

          def prepare_git(directory, releases, repo, token, rebuild):
              askpass = directory / "askpass"
              askpass.write_text('#!/bin/sh\ncase "$1" in\n*Username*) printf "%s\\n" "$SYNC_USERNAME" ;;\n*Password*) printf "%s\\n" "$SYNC_TOKEN" ;;\n*) exit 1 ;;\nesac\n')
              askpass.chmod(0o700)
              bare = directory / "source.git"
              git(["init", "--bare", "--template=", str(bare)], directory, "x-access-token", token, askpass)
              refs = ["refs/tags/" + r["tag_name"] for r in releases]
              for ref in refs:
                  git(["check-ref-format", ref], bare, "x-access-token", token, askpass)
              specs = ["+refs/tags/*:refs/tags/*"] if rebuild else ["+" + ref + ":" + ref for ref in refs]
              if specs:
                  git(["fetch", "--force", "--no-tags", "--no-recurse-submodules",
                       "https://github.com/" + repo + ".git"] + specs,
                      bare, "x-access-token", token, askpass)
              for ref in refs:
                  git(["show-ref", "--verify", ref], bare, "x-access-token", token, askpass)
              return bare, askpass

          def remote_url(client):
              host = "gitlab.com" if client.platform == "GitLab" else "gitee.com"
              return "https://" + host + "/" + PROJECT + ".git"

          def target_tags(client, bare, askpass, username):
              output = git(["ls-remote", "--tags", "--refs", remote_url(client)],
                           bare, username, client.token, askpass)
              refs = []
              for line in output.decode().splitlines():
                  fields = line.split()
                  if (len(fields) != 2 or not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", fields[0])
                          or not fields[1].startswith("refs/tags/")):
                      raise MirrorError("Invalid target tag")
                  git(["check-ref-format", fields[1]], bare, username, client.token, askpass)
                  refs.append(fields[1])
              return refs

          def push_refs(client, bare, askpass, username, specs):
              for offset in range(0, len(specs), 100):
                  git(["push", "--porcelain", remote_url(client)] + specs[offset:offset + 100],
                      bare, username, client.token, askpass)

          def package_version(tag):
              return "tag-" + tag.encode("utf-8").hex()

          def package_reference(client, url, project_id):
              if not isinstance(url, str) or not url:
                  raise MirrorError("Invalid package link")
              parsed = checked_url(url)
              if origin(url) != origin(client.base):
                  return None
              parts = [urllib.parse.unquote(part, errors="strict") for part in parsed.path.split("/")]
              if "packages" not in parts:
                  return None
              if (len(parts) != 10 or parts[:4] != ["", "api", "v4", "projects"]
                      or parts[4] not in (PROJECT, str(project_id)) or parts[5:7] != ["packages", "generic"]
                      or parsed.query or any(not part or part in (".", "..") or "%" in part
                                           or "/" in part or "\\" in part for part in parts[7:9])):
                  raise MirrorError("Ambiguous package link")
              return parts[7], parts[8]

          def plan_cleanup(client, releases, rebuild=False, source=None):
              plan = {"releases": [], "children": [], "packages": []}
              references = set()
              project_id = client.api("GET", "")["id"] if client.platform == "GitLab" else None
              for release in releases:
                  key = release["tag_name"] if client.platform == "GitLab" else release["id"]
                  endpoint = "/releases/" + quote(key)
                  child = endpoint + ("/assets/links" if client.platform == "GitLab" else "/attach_files")
                  for item in client.pages(child):
                      plan["children"].append(child + "/" + quote(item["id"]))
                      if client.platform == "GitLab" and not rebuild:
                          reference = package_reference(client, item.get("url"), project_id)
                          if reference:
                              references.add(reference)
                  plan["releases"].append(endpoint)
              if client.platform == "GitLab":
                  tag = source["tag_name"] if source else None
                  versions = {tag, package_version(tag), tag[1:] if tag.startswith("v") else tag} if tag else set()
                  asset_ids = {str(a["id"]) for a in (source or {}).get("assets", [])}
                  for package in client.pages("/packages?package_type=generic"):
                      name, version = package.get("name"), package.get("version")
                      legacy = re.fullmatch(r"asset-([0-9]+)-[0-9a-fA-F]{64}", version or "")
                      if (package.get("package_type") == "generic" and name in PACKAGE_NAMES
                              and (rebuild or version in versions or (name, version) in references
                                   or name == "release-mirror" and legacy and legacy[1] in asset_ids)):
                          plan["packages"].append("/packages/" + quote(package["id"]))
              return plan

          def clean(client, plan, remove_releases):
              for endpoint in plan["children"] + plan["packages"]:
                  client.api("DELETE", endpoint, missing=True)
              if remove_releases:
                  for endpoint in plan["releases"]:
                      client.api("DELETE", endpoint, missing=True)

          def mirror(client, release, cache, existing):
              tag = release["tag_name"]
              assets = release["assets"]
              if client.platform == "GitLab":
                  endpoint = "/releases/" + quote(tag)
                  urls = {}
                  for asset in assets:
                      package = "/packages/generic/release-mirror/{}/{}".format(package_version(tag), quote(asset["name"]))
                      client.upload(cache.path(asset), package)
                      urls[asset["name"]] = client.base + package
                  payload = {"name": release.get("name") or tag,
                             "description": render_body(release.get("body"), assets, urls),
                             "released_at": release["published_at"]}
                  if existing is None:
                      client.api("POST", "/releases", dict(payload, tag_name=tag))
                  else:
                      client.api("PUT", endpoint, payload)
                  for name, url in urls.items():
                      client.api("POST", endpoint + "/assets/links", {"name": name, "url": url, "link_type": "package"})
              else:
                  urls = {a["name"]: "https://gitee.com/" + PROJECT + "/releases/download/" + quote(tag) + "/" + quote(a["name"])
                          for a in assets}
                  payload = {"tag_name": tag, "name": release.get("name") or tag,
                             "body": render_body(release.get("body"), assets, urls),
                             "prerelease": str(bool(release.get("prerelease"))).lower()}
                  if existing is None:
                      existing = client.api("POST", "/releases", dict(payload, target_commitish=tag))
                  endpoint = "/releases/" + quote(existing["id"])
                  for asset in assets:
                      uploaded = client.upload(cache.path(asset), endpoint + "/attach_files")
                      if not isinstance(uploaded, dict) or uploaded.get("id") is None:
                          raise MirrorError("Invalid upload response")
                  client.api("PATCH", endpoint, payload)

          def get_release(client, tag):
              path = "/releases/" if client.platform == "GitLab" else "/releases/tags/"
              return client.api("GET", path + quote(tag), missing=True)

          def valid_token(token):
              return bool(token) and not any(ord(c) < 33 or ord(c) == 127 for c in token)

          def deletion_is_current(github, source):
              current = github.api("GET", "/releases/" + quote(source["id"]), missing=True)
              if current is not None and (not current.get("draft") or current["tag_name"] != source["tag_name"]):
                  return False
              current = get_release(github, source["tag_name"])
              return current is None or (current.get("draft") and current["id"] == source["id"])

          def delete_source_tag(github, source):
              if not deletion_is_current(github, source):
                  return False
              tag = quote(source["tag_name"])
              reference = github.api("GET", "/git/ref/tags/" + tag, missing=True)
              if reference is not None:
                  if not deletion_is_current(github, source):
                      return False
                  github.api("DELETE", "/git/refs/tags/" + tag, missing=True)
              return True

          def sync(github, targets, repo, event_name, event, confirmation):
              rebuild = event_name == "workflow_dispatch"
              if rebuild and confirmation != "REBUILD":
                  raise MirrorError("REBUILD confirmation required")
              if not rebuild and event_name != "release":
                  raise MirrorError("Unsupported event")
              deleting = not rebuild and event.get("action") in ("deleted", "unpublished")
              if rebuild:
                  releases = snapshot(github)
                  source = None
              else:
                  source = event["release"]
                  if source.get("draft") and not deleting:
                      return
                  if deleting:
                      releases = []
                  else:
                      source = github.api("GET", "/releases/" + quote(source["id"]))
                      if source.get("draft"):
                          return
                      if source["tag_name"] != event["release"]["tag_name"]:
                          raise MirrorError("Event tag changed")
                      source["assets"] = github.pages("/releases/{}/assets".format(quote(source["id"])))
                      releases = [source]
                      validate_releases(releases)
              if deleting:
                  if not delete_source_tag(github, source):
                      print("Stale deletion event skipped")
                      return
              else:
                  for release in releases:
                      urls = {a["name"]: a["browser_download_url"] for a in release["assets"]}
                      body = render_body(release.get("body"), release["assets"], urls)
                      if body != (release.get("body") or ""):
                          github.api("PATCH", "/releases/" + quote(release["id"]), {"body": body})
              with tempfile.TemporaryDirectory(prefix="release-mirror-") as temporary:
                  directory = pathlib.Path(temporary)
                  cache = AssetCache(github, directory)
                  for release in releases:
                      for asset in release["assets"]:
                          cache.path(asset)
                  bare, askpass = prepare_git(directory, releases, repo, github.token, rebuild)
                  if deleting:
                      git(["check-ref-format", "refs/tags/" + source["tag_name"]], bare,
                          "x-access-token", github.token, askpass)
                  failures = []
                  def attempt(platform, operation):
                      try:
                          operation()
                          print(platform + " completed")
                          return True
                      except Exception:
                          failures.append(platform)
                          print(platform + " failed; details suppressed")
                          return False
                  for client, username in sorted(targets, key=lambda target: {"Gitee": 0, "GitLab": 1}[target[0].platform]):
                      def process():
                          if not valid_token(client.token):
                              raise MirrorError("Missing credentials")
                          if rebuild:
                              current = client.pages("/releases")
                              plan = plan_cleanup(client, current, rebuild=True)
                              refs = target_tags(client, bare, askpass, username)
                              clean(client, plan, remove_releases=True)
                              push_refs(client, bare, askpass, username, [":" + ref for ref in refs])
                              local = git(["for-each-ref", "--format=%(refname)", "refs/tags/"],
                                          bare, "x-access-token", github.token, askpass)
                              if local.strip():
                                  push_refs(client, bare, askpass, username, ["+refs/tags/*:refs/tags/*"])
                              for release in releases:
                                  mirror(client, release, cache, None)
                          else:
                              tag = source["tag_name"]
                              existing = get_release(client, tag)
                              plan = plan_cleanup(client, [existing] if existing else [], source=source)
                              clean(client, plan, remove_releases=deleting)
                              ref = "refs/tags/" + tag
                              if deleting:
                                  refs = target_tags(client, bare, askpass, username)
                                  if ref in refs:
                                      push_refs(client, bare, askpass, username, [":" + ref])
                              else:
                                  push_refs(client, bare, askpass, username, ["+" + ref + ":" + ref])
                                  mirror(client, source, cache, existing)
                      if not attempt(client.platform, process) and rebuild:
                          break
                  if failures:
                      raise MirrorError("One or more platforms failed")

          def run():
              repo = os.environ.get("GH_REPO", "")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise MirrorError("Invalid repository")
              token = os.environ.get("GH_TOKEN", "")
              if not valid_token(token):
                  raise MirrorError("Missing GitHub credentials")
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              confirmation = os.environ.get("CONFIRMATION", "")
              if event_name == "workflow_dispatch" and confirmation != "REBUILD":
                  raise MirrorError("REBUILD confirmation required")
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
                  event = json.load(stream)
              github = Client("GitHub", token, repo)
              targets = [(Client("Gitee", os.environ.get("GITEE_TOKEN", "")), "gitsethub"),
                         (Client("GitLab", os.environ.get("GITLAB_TOKEN", "")), "oauth2")]
              sync(github, targets, repo, event_name, event, confirmation)

          if __name__ == "__main__":
              try:
                  run()
              except Exception:
                  print("Release mirror failed; details suppressed")
                  raise SystemExit(1)
          PY
