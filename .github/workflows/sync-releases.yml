# 在 GitHub Actions 左侧显示的任务名称。
# 用途：将 GitHub 已发布版本的标签、说明和安装包同步到 GitLab、Gitee。
# 不负责 main/master 分支同步，也不会修改 version.json。
name: Sync releases

# 自动触发和手动触发二选一即可运行。
on:
  # 点击发布 Release 时自动运行；草稿保存、发布后补传附件不会因此自动运行。
  release:
    types: [published]
  # 在 Actions → Sync releases → Run workflow 中手动补同步。
  workflow_dispatch:
    inputs:
      tag:
        description: "需要同步的已发布版本标签，例如 v3.2.1"
        required: true
        type: string

# GitHub 自动提供的令牌只需读取仓库和 Release，无需手动创建 GitHub 令牌。
# GitLab、Gitee 的写权限由下方 Secrets 中的令牌提供。
permissions:
  contents: read

# 同一个版本的同步任务不同时运行；不取消已经开始的同步。
# GitHub 对同一组通常只保留一个运行中任务和一个等待任务。
concurrency:
  group: sync-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release to ${{ matrix.target }}
    # 使用 GitHub 提供的 Linux 云端机器，不需要自己的电脑一直开机。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个平台失败，不取消另一个平台的同步任务。
      fail-fast: false
      matrix:
        # 同一套步骤分别运行两次，每次处理一个目标平台。
        target: [GitLab, Gitee]

    steps:
      - name: Prepare and sync release
        shell: bash
        # 环境变量：把平台信息和凭证传给下面的 Bash、Python 脚本。
        # secrets.xxx 从仓库 Settings → Secrets and variables → Actions 读取。
        # 不要把真实令牌直接写进本文件。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 手动运行时使用输入的 Tag；自动运行时使用刚发布的 Tag。
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
          # 此处环境变量叫 GITLAB_TOKEN，但读取的是发布专用 Secret，需要 api 权限。
          GITLAB_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # 命令失败、变量未定义或管道失败时停止，避免失败后继续发布。
          set -euo pipefail
          # 检查云端机器是否提供所需工具；不是在你的 Mac 上执行。
          command -v gh
          command -v jq
          command -v curl
          command -v git
          command -v python3

          # 读取该 Tag 的完整发布信息，保存为云端临时 JSON；拒绝同步草稿。
          gh api "repos/$GH_REPO/releases/tags/$(jq -rn --arg v "$RELEASE_TAG" '$v|@uri')" > release.json
          jq -e '.draft == false' release.json > /dev/null
          jq -r '.body // ""' release.json > notes.md
          title=$(jq -r '.name // .tag_name' release.json)
          prerelease=$(jq -r '.prerelease' release.json)
          encoded_tag=$(jq -rn --arg v "$RELEASE_TAG" '$v|@uri')

          # 下载此版本手动上传的附件，例如 dmg；不下载自动生成的源码压缩包。
          mkdir assets
          asset_count=$(jq '.assets | length' release.json)
          if [ "$asset_count" -gt 0 ]; then
            gh release download "$RELEASE_TAG" --dir assets
          fi

          # 获取 Git 仓库历史并确认版本标签存在，不检出或执行仓库内的项目代码。
          # 此克隆命令未使用 GH_TOKEN，当前写法适用于可匿名读取的公开仓库。
          git clone --bare "https://github.com/$GH_REPO.git" source.git
          git -C source.git show-ref --verify "refs/tags/$RELEASE_TAG"

          # 创建临时认证脚本，Git 询问账号、密码时从环境变量中读取。
          # 不把令牌拼进仓库 URL，避免令牌出现在 URL 日志中。
          cat > "$RUNNER_TEMP/release-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$SYNC_USERNAME" ;;
            *Password*) printf '%s\n' "$SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/release-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/release-askpass.sh"

          # 根据当前任务的平台选择推送账号、令牌和目标仓库。
          # Gitee 的 gitsethub 必须是令牌所属账号的实际登录用户名。
          if [ "$TARGET" = "GitLab" ]; then
            test -n "$GITLAB_TOKEN"
            export SYNC_USERNAME=oauth2
            export SYNC_TOKEN="$GITLAB_TOKEN"
            target_url=https://gitlab.com/gitsethub/appcloner.git
          else
            test -n "$GITEE_TOKEN"
            export SYNC_USERNAME=gitsethub
            export SYNC_TOKEN="$GITEE_TOKEN"
            target_url=https://gitee.com/gitsethub/appcloner.git
          fi

          # 只推送本次 Release 的 Tag，确保目标平台关联同一份历史代码。
          # 不强制覆盖；目标存在同名但不同内容的 Tag 时会停止，需要人工确认。
          git -C source.git push "$target_url" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          # 以下使用 Python 标准库调用平台 API，无需额外安装第三方 Python 包。
          # PY 结束标记之前都是 Python 代码；编辑时不要破坏现有缩进。
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          # 从环境变量、GitHub 发布信息读取平台、标签、正文和标题。
          # quote 用于转义标签、文件名中的 URL 特殊字符。
          target = os.environ["TARGET"]
          release = json.loads(pathlib.Path("release.json").read_text())
          tag = release["tag_name"]
          quote = lambda value: urllib.parse.quote(str(value), safe="")
          body = release.get("body") or ""
          name = release.get("name") or tag

          # 通用接口请求：GET 查询、POST 创建、PUT/PATCH 更新。
          # GitLab 使用请求头令牌和 JSON；Gitee 按接口要求使用查询参数或表单。
          # missing=True 时仅把 HTTP 404 当作不存在；其他错误直接停止。
          def api(method, url, token, data=None, missing=False):
              headers = {"User-Agent": "AppCloner-release-sync"}
              if target == "GitLab":
                  headers["PRIVATE-TOKEN"] = token
                  payload = None if data is None else json.dumps(data).encode()
                  if payload is not None:
                      headers["Content-Type"] = "application/json"
              else:
                  fields = dict(data or {})
                  fields["access_token"] = token
                  if method == "GET":
                      url += ("&" if "?" in url else "?") + urllib.parse.urlencode(fields)
                      payload = None
                  else:
                      payload = urllib.parse.urlencode(fields).encode()
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      content = response.read()
                      return json.loads(content) if content else None
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError(f"{target} API {method} failed: HTTP {error.code}") from None
              except urllib.error.URLError:
                  raise RuntimeError(f"{target} network request failed") from None

          # 上传安装包实体：GitLab 使用 PUT 文件上传，Gitee 使用 multipart 表单。
          # 令牌通过标准输入交给 curl，不作为明文命令行参数。
          # 单个上传最多等待 900 秒；不自动重试，失败时可手动重跑工作流。
          def upload(url, token, path, gitee=False):
              headers = f'PRIVATE-TOKEN: {token}\n' if not gitee else ""
              args = [
                  "curl", "--silent", "--show-error", "--fail",
                  "--connect-timeout", "30", "--max-time", "900",
              ]
              if gitee:
                  args += [
                      "--form", f"file=@{path}",
                      "--form", "access_token=<-",
                  ]
                  stdin = token.encode()
              else:
                  args += ["--header", "@-", "--upload-file", str(path)]
                  stdin = headers.encode()
              result = subprocess.run(
                  args + [url], input=stdin, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode:
                  raise RuntimeError(f"{target} attachment upload failed, curl exit {result.returncode}")
              return json.loads(result.stdout) if result.stdout else None

          # 上传前检查文件名、下载大小；GitHub 提供 SHA256 时再检查哈希。
          # 这些检查用于发现附件下载不完整或内容不匹配。
          assets = release["assets"]
          for asset in assets:
              filename = asset["name"]
              if filename in (".", "..") or "/" in filename or "\\" in filename:
                  raise RuntimeError("Unsupported attachment filename")
              path = pathlib.Path("assets") / filename
              if path.stat().st_size != asset["size"]:
                  raise RuntimeError("Downloaded attachment size mismatch")
              digest = asset.get("digest")
              if digest and digest.startswith("sha256:"):
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != digest.removeprefix("sha256:"):
                      raise RuntimeError("Downloaded attachment checksum mismatch")

          # GitLab：先将文件保存到软件包仓库，再把下载地址关联到 Release。
          # 项目需开启 Package Registry；访客能否下载还取决于可见性设置。
          if target == "GitLab":
              token = os.environ["GITLAB_TOKEN"]
              base = "https://gitlab.com/api/v4/projects/gitsethub%2Fappcloner"
              endpoint = f"{base}/releases/{quote(tag)}"
              existing = api("GET", endpoint, token, missing=True)
              links = []
              for asset in assets:
                  filename = asset["name"]
                  # 使用 GitHub 附件 ID 作为软件包版本，保留原始附件文件名。
                  # 每次重跑都会请求上传，可能产生同路径的重复软件包文件记录。
                  url = (
                      f"{base}/packages/generic/appcloner/"
                      f"asset-{asset['id']}/{quote(filename)}"
                  )
                  upload(url, token, pathlib.Path("assets") / filename)
                  links.append({"name": filename, "url": url, "link_type": "package"})
                  # 只替换正文中完全匹配的 GitHub 附件完整 URL。
                  # 相对链接、latest 链接等其他写法不会被自动识别替换。
                  body = body.replace(asset["browser_download_url"], url)
              # 无同版本 Release 则创建；已有则覆盖标题、说明，不删除整个 Release。
              payload = {"name": name, "description": body}
              if existing is None:
                  payload["tag_name"] = tag
                  api("POST", f"{base}/releases", token, payload)
              else:
                  api("PUT", endpoint, token, payload)
              # 同名下载入口更新地址，不存在则新建；不删除其他下载入口。
              # 当前仅读取前 100 个入口，适用于附件数量较少的版本。
              current = api("GET", f"{endpoint}/assets/links?per_page=100", token)
              for link in links:
                  match = next((item for item in current if item["name"] == link["name"]), None)
                  if match:
                      api("PUT", f"{endpoint}/assets/links/{match['id']}", token, link)
                  else:
                      api("POST", f"{endpoint}/assets/links", token, link)
          else:
              # Gitee：按 Tag 查找发行版，创建或更新标题、说明及预览版标记。
              # 附件处理完成后，将正文中的 GitHub 附件完整链接替换为 Gitee 下载链接。
              token = os.environ["GITEE_TOKEN"]
              base = "https://gitee.com/api/v5/repos/gitsethub/appcloner"
              existing = api("GET", f"{base}/releases/tags/{quote(tag)}", token, missing=True)
              payload = {
                  "tag_name": tag,
                  "name": name,
                  "body": body or name,
                  "prerelease": str(release["prerelease"]).lower(),
              }
              if existing is None:
                  payload["target_commitish"] = tag
                  existing = api("POST", f"{base}/releases", token, payload)
              else:
                  api("PATCH", f"{base}/releases/{existing['id']}", token, payload)
              # 分页读取该 Gitee 发行版已有的附件，每页最多 100 个。
              endpoint = f"{base}/releases/{existing['id']}/attach_files"
              current = []
              page = 1
              while True:
                  batch = api("GET", f"{endpoint}?per_page=100&page={page}", token)
                  if not isinstance(batch, list):
                      raise RuntimeError("Unexpected Gitee attachment response")
                  current.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              for asset in assets:
                  filename = asset["name"]
                  # 同名附件继续复用，但仍替换正文链接；不会检查已有文件内容。
                  # 如替换了同名安装包，需先在 Gitee 删除旧附件，再手动重跑。
                  attachment = next(
                      (item for item in current if item.get("name") == filename), None
                  )
                  if attachment is None:
                      # 上传成功后读取附件 ID，构造该 Gitee 附件的官方 API 下载地址。
                      attachment = upload(
                          endpoint, token, pathlib.Path("assets") / filename, gitee=True
                      )
                  else:
                      print(f"Gitee: existing attachment kept: {filename}")
                  if not isinstance(attachment, dict) or attachment.get("id") is None:
                      raise RuntimeError("Gitee attachment response is missing its ID")
                  attachment_id = quote(attachment["id"])
                  download_url = f"{endpoint}/{attachment_id}/download"
                  # 公开正文中绝不添加访问令牌；匿名下载权限由 Gitee 仓库设置决定。
                  # 仅替换完全匹配的完整 URL，不处理相对链接或 latest 链接。
                  body = body.replace(asset["browser_download_url"], download_url)

              # 已有附件也执行回写，因此手动重跑即可修正历史版本正文中的链接。
              payload["body"] = body or name
              api("PATCH", f"{base}/releases/{existing['id']}", token, payload)

          # 只有执行到这里，当前平台的脚本才算完成；另一平台需看其独立任务结果。
          # 此脚本不会跟随 GitHub 删除目标版本、附件，也不会同步下载次数。
          print(f"{target}: release sync completed: {tag}")
          PY
