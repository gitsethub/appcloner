# 在 GitHub Actions 左侧显示的任务名称。
# 用途：将 GitHub 已发布版本的标签、说明和安装包同步到 GitLab。
name: Sync Releases To GitLab

# 自动触发和手动触发二选一即可运行。
# GitHub 是唯一事实来源，GitLab 侧跟随这些事件更新。
on:
  # Release 事件：发布、编辑、预发布/正式状态切换、创建、删除、取消发布。
  # 草稿的创建、编辑、删除会触发事件，但在下方 job 的 if 中被过滤掉，不会运行。
  release:
    types: [published, edited, prereleased, released, created, deleted, unpublished]
  # 推送新 Tag 或移动 Tag 指向：仅响应 Tag，忽略分支。
  push:
    tags:
      - '**'
  # create / delete 对分支和 Tag 都会触发，在下方 job 的 if 中过滤为仅 Tag。
  create:
  delete:
  # 在 Actions → Sync Releases To GitLab → Run workflow 中手动补同步。
  workflow_dispatch:
    inputs:
      tag:
        description: "需要同步的已发布版本标签，例如 v3.2.1"
        required: true
        type: string

# 需写回 GitHub Release 正文（补全/替换下载链接），故授予 contents 写权限。
# GitLab 的写权限由下方 Secrets 中的令牌提供。
permissions:
  contents: write

# 同一个版本的同步任务不同时运行；不取消已经开始的同步。
# GitHub 对同一组通常只保留一个运行中任务和一个等待任务。
concurrency:
  group: sync-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync release to GitLab
    # create / delete 事件对分支和 Tag 都会触发，这里只放行 Tag，忽略分支；
    # release 事件中，草稿的 created / edited / deleted 被过滤掉（不触发同步）；
    # 其余 release 事件（published / edited 已发布版 / prereleased / released /
    # deleted 已发布版 / unpublished）以及 push(tags) / workflow_dispatch 直接放行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'create' && github.event.ref_type == 'tag') ||
      (github.event_name == 'delete' && github.event.ref_type == 'tag') ||
      (github.event_name == 'release' && (github.event.action != 'created' && github.event.action != 'edited' && github.event.action != 'deleted' || !github.event.release.draft))
    # 使用 GitHub 提供的 Linux 云端机器，不需要自己的电脑一直开机。
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare and sync release
        shell: bash
        # 环境变量：把平台信息和凭证传给下面的 Bash、Python 脚本。
        # secrets.xxx 从仓库 Settings → Secrets and variables → Actions 读取。
        # 不要把真实令牌直接写进本文件。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # 手动运行时使用输入的 Tag；release 事件取 release.tag_name；
          # push / create / delete Tag 事件取 github.ref_name（即 Tag 名）。
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          # 事件上下文：判定删除模式、回查陈旧事件时使用。
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          RELEASE_ID: ${{ github.event.release.id }}
          # 读取拥有全部权限的 GitLab Secret。
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN_HAVE_ALL_PERMISSIONS }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # 命令失败、变量未定义或管道失败时停止，避免失败后继续发布。
          set -euo pipefail
          # 检查云端机器是否提供所需工具；不是在你的 Mac 上执行。
          command -v gh
          command -v jq
          command -v curl
          command -v git
          command -v python3

          # 判定删除模式：release 被删除/取消发布，或删除 Tag。
          deleting=false
          if [ "$EVENT_NAME" = "release" ] && { [ "$EVENT_ACTION" = "deleted" ] || [ "$EVENT_ACTION" = "unpublished" ]; }; then
            deleting=true
          elif [ "$EVENT_NAME" = "delete" ]; then
            deleting=true
          fi

          # 创建临时认证脚本，Git 询问账号、密码时从环境变量中读取。
          # 不把令牌拼进仓库 URL，避免令牌出现在 URL 日志中。
          cat > "$RUNNER_TEMP/release-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$SYNC_USERNAME" ;;
            *Password*) printf '%s\n' "$SYNC_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/release-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/release-askpass.sh"

          # 推送账号、令牌和目标仓库。
          test -n "$GITLAB_TOKEN"
          export SYNC_USERNAME=oauth2
          export SYNC_TOKEN="$GITLAB_TOKEN"
          target_url=https://gitlab.com/gitsethub/appcloner.git

          if [ "$deleting" = true ]; then
            # 删除模式：GitHub 上 release/tag 已不存在，不读取快照。
            # Python 先回查 GitHub 防止陈旧事件误删，再删除 GitLab 对应内容。
            DELETING=1 python3 -c 'import sys,textwrap; exec(textwrap.dedent(sys.stdin.read()))' <<'PY'
            import json, os, urllib.error, urllib.parse, urllib.request

            tag = os.environ["RELEASE_TAG"]
            token = os.environ["GITLAB_TOKEN"]
            base = "https://gitlab.com/api/v4/projects/gitsethub%2Fappcloner"
            release_id = os.environ.get("RELEASE_ID") or ""
            quote = lambda value: urllib.parse.quote(str(value), safe="")

            def gl_api(method, url, missing=False):
                headers = {"User-Agent": "AppCloner-release-sync", "PRIVATE-TOKEN": token}
                request = urllib.request.Request(url, headers=headers, method=method)
                try:
                    with urllib.request.urlopen(request, timeout=120) as response:
                        raw = response.read()
                        return json.loads(raw) if raw else None
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise RuntimeError(f"GitLab API {method} failed: HTTP {error.code}") from None
                except urllib.error.URLError:
                    raise RuntimeError("GitLab network request failed") from None

            def gh_api(path, missing=False):
                url = "https://api.github.com/repos/" + os.environ["GH_REPO"] + path
                request = urllib.request.Request(url, headers={
                    "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "AppCloner-release-sync",
                })
                try:
                    with urllib.request.urlopen(request, timeout=60) as response:
                        raw = response.read()
                        return json.loads(raw) if raw else None
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise RuntimeError(f"GitHub API failed: HTTP {error.code}") from None

            # 陈旧事件保护：回查 GitHub，若该 release 已被重建为非草稿则跳过删除。
            skip = False
            if release_id:
                current = gh_api("/releases/" + release_id, missing=True)
                if current is not None and (not current.get("draft") or current.get("tag_name") != tag):
                    skip = True
            if not skip:
                current = gh_api("/releases/tags/" + quote(tag), missing=True)
                if current is not None and not current.get("draft"):
                    skip = True
            if skip:
                print(f"Stale deletion event skipped: {tag}")
                raise SystemExit(0)

            # 解析 Release 下载入口指向的 GitLab Package（附件本体实际存储位置）。
            # 附件本体在 Package Registry，Release 只存链接；删 Release 不会自动删附件。
            def package_reference(link_url):
                if not isinstance(link_url, str) or not link_url:
                    return None
                parsed = urllib.parse.urlsplit(link_url)
                if parsed.scheme != "https" or parsed.hostname != "gitlab.com":
                    return None
                parts = parsed.path.split("/")
                try:
                    idx = parts.index("packages")
                except ValueError:
                    return None
                if idx + 4 > len(parts) or parts[idx + 1] != "generic":
                    return None
                name, version = parts[idx + 2], parts[idx + 3]
                if not name or not version or name in (".", "..") or version in (".", ".."):
                    return None
                return name, version

            def list_packages():
                result = []
                page = 1
                while True:
                    batch = gl_api("GET", f"{base}/packages?package_type=generic&per_page=100&page={page}") or []
                    if not isinstance(batch, list):
                        raise RuntimeError("Unexpected GitLab packages response")
                    result.extend(batch)
                    if len(batch) < 100:
                        break
                    page += 1
                return result

            # 删除 GitLab 上该 tag 的 Release、下载入口，以及对应的 Package 附件本体。
            endpoint = f"{base}/releases/{quote(tag)}"
            existing = gl_api("GET", endpoint, missing=True)
            if existing is not None:
                links = []
                lpage = 1
                while True:
                    batch = gl_api("GET", f"{endpoint}/assets/links?per_page=100&page={lpage}") or []
                    links.extend(batch)
                    if len(batch) < 100:
                        break
                    lpage += 1
                references = set()
                for link in links:
                    for field in ("url", "direct_asset_url"):
                        ref = package_reference(link.get(field))
                        if ref is not None:
                            references.add(ref)
                # 先删 Package 附件本体：版本号用 GitHub 附件 ID，唯一归属本 Release。
                if references:
                    for package in list_packages():
                        key = (package.get("name"), package.get("version"))
                        if key in references:
                            gl_api("DELETE", f"{base}/packages/{package['id']}", missing=True)
                            print(f"GitLab package deleted: {key[0]}/{key[1]}")
                # 再删下载入口，最后删 Release。
                for link in links:
                    gl_api("DELETE", f"{endpoint}/assets/links/{link['id']}", missing=True)
                gl_api("DELETE", endpoint, missing=True)
                print(f"GitLab release deleted: {tag}")
            else:
                print(f"GitLab release absent: {tag}")

            # 仅当 GitHub 上该 Tag 也不存在时，才删除 GitLab 的 Tag。
            # release 删除但 tag 仍在（deleted/unpublished 常见）→ 保留 GitLab tag。
            tag_gone = gh_api("/git/ref/tags/" + quote(tag), missing=True) is None
            if tag_gone:
                gl_api("DELETE", f"{base}/repository/tags/{quote(tag)}", missing=True)
                print(f"GitLab tag deleted: {tag}")
            else:
                print(f"GitLab tag kept (GitHub tag still exists): {tag}")
            # 全量对账清扫：以 GitHub 全量附件为唯一事实来源，清理 GitLab 上多余的 appcloner 包，
            # 确保删除事件后 GitLab 无多余附件残留；name 不是 appcloner 的包不动。
            legal_versions = set()
            gpage = 1
            while True:
                gh_releases = gh_api(f"/releases?per_page=100&page={gpage}") or []
                for gr in gh_releases:
                    if gr.get("draft"):
                        continue
                    apage = 1
                    while True:
                        gh_assets = gh_api(f"/releases/{gr['id']}/assets?per_page=100&page={apage}") or []
                        for ga in gh_assets:
                            legal_versions.add(f"asset-{ga['id']}")
                        if len(gh_assets) < 100:
                            break
                        apage += 1
                if len(gh_releases) < 100:
                    break
                gpage += 1
            for package in list_packages():
                if package.get("name") != "appcloner":
                    continue
                if (package.get("version") or "") not in legal_versions:
                    gl_api("DELETE", f"{base}/packages/{package['id']}", missing=True)
                    print(f"GitLab package swept (not on GitHub): {package.get('name')}/{package.get('version')}")
            print(f"GitLab: release deletion completed: {tag}")
          PY
            exit 0
          fi

          # 同步模式：读取 GitHub release；tag 存在但无 release 时只同步 Tag。
          has_release=false
          if gh api "repos/$GH_REPO/releases/tags/$(jq -rn --arg v "$RELEASE_TAG" '$v|@uri')" > release.json 2>/dev/null; then
            if jq -e '.draft == false' release.json >/dev/null 2>&1; then
              has_release=true
            fi
          fi

          if [ "$has_release" = true ]; then
            # 下载此版本手动上传的附件，例如 dmg；不下载自动生成的源码压缩包。
            mkdir -p assets
            asset_count=$(jq '.assets | length' release.json)
            if [ "$asset_count" -gt 0 ]; then
              gh release download "$RELEASE_TAG" --dir assets
            fi
          fi

          # 获取 Git 仓库历史，用于推送 Tag；不检出或执行仓库内的项目代码。
          git clone --bare "https://github.com/$GH_REPO.git" source.git
          git -C source.git show-ref --verify "refs/tags/$RELEASE_TAG"
          # 推送本次 Tag；--force 以支持修改 Tag 指向。GitHub 为唯一事实来源。
          git -C source.git push --force "$target_url" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          if [ "$has_release" = true ]; then

          # 以下使用 Python 标准库调用平台 API，无需额外安装第三方 Python 包。
          # PY 结束标记之前都是 Python 代码；编辑时不要破坏现有缩进。
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          # 从 GitHub 发布信息读取标签、正文和标题。
          # quote 用于转义标签、文件名中的 URL 特殊字符。
          release = json.loads(pathlib.Path("release.json").read_text())
          tag = release["tag_name"]
          quote = lambda value: urllib.parse.quote(str(value), safe="")

          # 解析下载入口 URL 指向的 GitLab Package（name, version）。
          # 附件本体存在 Package Registry，Release 只存链接；用于清理旧附件。
          def package_reference(link_url):
              if not isinstance(link_url, str) or not link_url:
                  return None
              parsed = urllib.parse.urlsplit(link_url)
              if parsed.scheme != "https" or parsed.hostname != "gitlab.com":
                  return None
              parts = parsed.path.split("/")
              try:
                  idx = parts.index("packages")
              except ValueError:
                  return None
              if idx + 4 > len(parts) or parts[idx + 1] != "generic":
                  return None
              pname, version = parts[idx + 2], parts[idx + 3]
              if not pname or not version or pname in (".", "..") or version in (".", ".."):
                  return None
              return pname, version

          # 下载链接区块标记：重复渲染时先移除旧区块再追加，保证不累积、可收敛。
          DL_BEGIN = "<!-- release-downloads:start -->"
          DL_END = "<!-- release-downloads:end -->"

          def strip_downloads(text):
              if text.count(DL_BEGIN) != text.count(DL_END) or text.count(DL_BEGIN) > 1:
                  raise RuntimeError("Malformed download section in body")
              if DL_BEGIN in text:
                  start, finish = text.index(DL_BEGIN), text.index(DL_END)
                  if finish < start:
                      raise RuntimeError("Malformed download section in body")
                  text = text[:start] + text[finish + len(DL_END):]
              return text.rstrip()

          # 渲染正文：移除旧下载区块与旧下载行，替换源附件链接，再追加下载链接区块。
          # urls: {filename: 目标平台下载地址}。
          def render_body(text, assets, urls):
              text = strip_downloads(text or "")
              source_urls = set(urls.values()) | {a["browser_download_url"] for a in assets}
              remaining = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if re.match(r"^下载链接\s*[:：]", stripped):
                      continue
                  if any(u in stripped for u in source_urls):
                      standalone = stripped.lstrip("- *").strip("`")
                      if standalone in source_urls or re.fullmatch(r"\[[^\n]*\]\(<?https?://[^\n]+>?\)", standalone):
                          continue
                  remaining.append(line)
              text = "\n".join(remaining).rstrip()
              for asset in sorted(assets, key=lambda a: len(a["browser_download_url"]), reverse=True):
                  text = text.replace(asset["browser_download_url"], urls[asset["name"]])
              lines = []
              for asset in assets:
                  fn = asset["name"]
                  label = fn.replace("\\", "\\\\").replace("[", "\\[").replace("]", "\\]")
                  dest = urls[fn].replace("(", "%28").replace(")", "%29")
                  lines.append("下载链接：[{}]({})".format(label, dest))
              section = DL_BEGIN + "\n" + "\n".join(lines) + "\n" + DL_END
              return ((text + "\n\n") if text else "") + section

          # 调用 GitHub API（用于规范化正文）。
          def gh_api(method, path, data=None):
              url = "https://api.github.com/repos/" + os.environ["GH_REPO"] + path
              headers = {
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "AppCloner-release-sync",
              }
              payload = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"GitHub API {method} failed: HTTP {error.code}") from None

          name = release.get("name") or tag

          # 第一件事：规范化 GitHub 正文，确保包含每个附件的下载链接；
          # 没有就补上，已有但不一致就替换为当前附件的正确地址。
          gh_urls = {a["name"]: a["browser_download_url"] for a in release["assets"]}
          gh_body = render_body(release.get("body") or "", release["assets"], gh_urls)
          if gh_body != (release.get("body") or ""):
              gh_api("PATCH", f"/releases/{release['id']}", {"body": gh_body})
              print(f"GitHub body updated with download links: {tag}")

          # 通用接口请求：GET 查询、POST 创建、PUT/PATCH 更新。
          # GitLab 使用请求头令牌和 JSON。
          # missing=True 时仅把 HTTP 404 当作不存在；其他错误直接停止。
          def api(method, url, token, data=None, missing=False):
              headers = {"User-Agent": "AppCloner-release-sync", "PRIVATE-TOKEN": token}
              payload = None if data is None else json.dumps(data).encode()
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      content = response.read()
                      return json.loads(content) if content else None
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  raise RuntimeError(f"GitLab API {method} failed: HTTP {error.code}") from None
              except urllib.error.URLError:
                  raise RuntimeError("GitLab network request failed") from None

          # 上传安装包实体：GitLab 使用 PUT 文件上传。
          # 令牌通过标准输入交给 curl，不作为明文命令行参数。
          # 单个上传最多等待 900 秒；不自动重试，失败时可手动重跑工作流。
          def upload(url, token, path):
              headers = f'PRIVATE-TOKEN: {token}\n'
              args = [
                  "curl", "--silent", "--show-error", "--fail",
                  "--connect-timeout", "30", "--max-time", "900",
                  "--header", "@-", "--upload-file", str(path),
              ]
              result = subprocess.run(
                  args + [url], input=headers.encode(), stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode:
                  raise RuntimeError(f"GitLab attachment upload failed, curl exit {result.returncode}")
              return json.loads(result.stdout) if result.stdout else None

          # 上传前检查文件名、下载大小；GitHub 提供 SHA256 时再检查哈希。
          # 这些检查用于发现附件下载不完整或内容不匹配。
          assets = release["assets"]
          for asset in assets:
              filename = asset["name"]
              if filename in (".", "..") or "/" in filename or "\\" in filename:
                  raise RuntimeError("Unsupported attachment filename")
              path = pathlib.Path("assets") / filename
              if path.stat().st_size != asset["size"]:
                  raise RuntimeError("Downloaded attachment size mismatch")
              digest = asset.get("digest")
              if digest and digest.startswith("sha256:"):
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != digest.removeprefix("sha256:"):
                      raise RuntimeError("Downloaded attachment checksum mismatch")

          # GitLab：先将文件保存到软件包仓库，再把下载地址关联到 Release。
          # 项目需开启 Package Registry；访客能否下载还取决于可见性设置。
          token = os.environ["GITLAB_TOKEN"]
          base = "https://gitlab.com/api/v4/projects/gitsethub%2Fappcloner"
          endpoint = f"{base}/releases/{quote(tag)}"
          existing = api("GET", endpoint, token, missing=True)

          # 查找 GitLab 上已有的 generic 包（按 name+version），用于上传前比对。
          def find_package(pname, version):
              page = 1
              while True:
                  batch = api("GET", f"{base}/packages?package_type=generic&package_name={quote(pname)}&per_page=100&page={page}", token) or []
                  for p in batch:
                      if p.get("version") == version:
                          return p
                  if len(batch) < 100:
                      return None
                  page += 1

          # 当 GitLab 未返回 file_sha256 时，下载远端文件计算哈希作为兜底。
          def download_remote_sha(package_url):
              request = urllib.request.Request(package_url, headers={
                  "PRIVATE-TOKEN": token, "User-Agent": "AppCloner-release-sync"})
              sha = hashlib.sha256()
              with urllib.request.urlopen(request, timeout=180) as response:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      sha.update(chunk)
              return sha.hexdigest()

          # 上传前比对两边安装包的大小与 SHA256，完全一致则跳过上传。
          # 仅当 GitLab 上存在对应安装包时才会真正比对；包或文件缺失则直接返回需要上传。
          def needs_upload(asset, url):
              package = find_package("appcloner", f"asset-{asset['id']}")
              if package is None:
                  return True
              files = api("GET", f"{base}/packages/{package['id']}/package_files", token) or []
              match = next((f for f in files if f.get("file_name") == asset["name"]), None)
              if match is None:
                  return True
              try:
                  remote_size = int(match.get("size"))
              except (TypeError, ValueError):
                  remote_size = -1
              if remote_size != int(asset["size"]):
                  return True
              local_sha = hashlib.sha256((pathlib.Path("assets") / asset["name"]).read_bytes()).hexdigest()
              remote_sha = match.get("file_sha256")
              if not remote_sha:
                  remote_sha = download_remote_sha(url)
              return remote_sha != local_sha

          links = []
          gl_urls = {}
          for asset in assets:
              filename = asset["name"]
              # 使用 GitHub 附件 ID 作为软件包版本，保留原始附件文件名。
              url = f"{base}/packages/generic/appcloner/asset-{asset['id']}/{quote(filename)}"
              gl_urls[filename] = url
