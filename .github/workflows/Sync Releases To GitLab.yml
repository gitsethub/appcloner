          # 同名下载入口更新地址，不存在则新建。
          # 分页读取该 Release 全部下载入口，避免超过 100 个时漏读漏删陈旧入口。
          current = []
          cpage = 1
          while True:
              batch = api("GET", f"{endpoint}/assets/links?per_page=100&page={cpage}", token) or []
              current.extend(batch)
              if len(batch) < 100:
                  break
              cpage += 1
          for link in links:
              match = next((item for item in current if item["name"] == link["name"]), None)
              if match:
                  api("PUT", f"{endpoint}/assets/links/{match['id']}", token, link)
              else:
                  api("POST", f"{endpoint}/assets/links", token, link)
          # 清理本 Release 多余的旧下载入口和旧 Package 附件本体，让编辑同步收敛。
          # 版本号用 GitHub 附件 ID，旧 Package 唯一归属本 Release，可安全删除。
          expected_names = {link["name"] for link in links}
          expected_refs = set()
          for link in links:
              ref = package_reference(link["url"])
              if ref is not None:
