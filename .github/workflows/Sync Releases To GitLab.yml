            import json, os, urllib.error, urllib.parse, urllib.request

            tag = os.environ["RELEASE_TAG"]
            token = os.environ["GITLAB_TOKEN"]
            base = "https://gitlab.com/api/v4/projects/gitsethub%2Fappcloner"
            quote = lambda value: urllib.parse.quote(str(value), safe="")

            def gl_api(method, url, missing=False):
                headers = {"User-Agent": "AppCloner-release-sync", "PRIVATE-TOKEN": token}
                request = urllib.request.Request(url, headers=headers, method=method)
                try:
                    with urllib.request.urlopen(request, timeout=120) as response:
                        raw = response.read()
                        return json.loads(raw) if raw else None
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise RuntimeError(f"GitLab API {method} failed: HTTP {error.code}") from None
                except urllib.error.URLError:
                    raise RuntimeError("GitLab network request failed") from None

            def gh_api(path, missing=False):
                url = "https://api.github.com/repos/" + os.environ["GH_REPO"] + path
                request = urllib.request.Request(url, headers={
                    "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "AppCloner-release-sync",
                })
                try:
                    with urllib.request.urlopen(request, timeout=60) as response:
                        raw = response.read()
                        return json.loads(raw) if raw else None
                except urllib.error.HTTPError as error:
                    if missing and error.code == 404:
                        return None
                    raise RuntimeError(f"GitHub API failed: HTTP {error.code}") from None

            def package_reference(link_url):
                if not isinstance(link_url, str) or not link_url:
                    return None
                parsed = urllib.parse.urlsplit(link_url)
                if parsed.scheme != "https" or parsed.hostname != "gitlab.com":
                    return None
                parts = parsed.path.split("/")
                try:
                    idx = parts.index("packages")
                except ValueError:
                    return None
                if idx + 4 > len(parts) or parts[idx + 1] != "generic":
                    return None
                name, version = parts[idx + 2], parts[idx + 3]
                if not name or not version or name in (".", "..") or version in (".", ".."):
                    return None
                return name, version

            def list_packages():
                result = []
                page = 1
                while True:
                    batch = gl_api("GET", f"{base}/packages?package_type=generic&per_page=100&page={page}") or []
                    if not isinstance(batch, list):
                        raise RuntimeError("Unexpected GitLab packages response")
                    result.extend(batch)
                    if len(batch) < 100:
                        break
                    page += 1
                return result

            # 清理该 tag 在 GitLab 上可能残留的 release（删除运行失败后的自愈）。
            endpoint = f"{base}/releases/{quote(tag)}"
