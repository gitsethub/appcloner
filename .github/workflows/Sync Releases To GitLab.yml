          if stale_refs:
              all_packages = []
              page = 1
              while True:
                  batch = api("GET", f"{base}/packages?package_type=generic&per_page=100&page={page}", token) or []
                  all_packages.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              for package in all_packages:
                  key = (package.get("name"), package.get("version"))
                  if key in stale_refs:
                      api("DELETE", f"{base}/packages/{package['id']}", token, missing=True)
          # 全量对账清扫：以 GitHub 全量附件为唯一事实来源，清理 GitLab 上多余的 appcloner 包。
          # GitHub 所有非草稿 Release 的附件 ID 构成合法版本集合；GitLab 上 name=appcloner
          # 但版本不在该集合中的包一律删除（含手动上传、旧脚本残留），确保 GitLab 对齐 GitHub。
