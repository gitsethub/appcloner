          stale_refs = set()
          for item in current:
              for field in ("url", "direct_asset_url"):
                  ref = package_reference(item.get(field))
                  if ref is not None and ref not in expected_refs:
                      stale_refs.add(ref)
              if item["name"] not in expected_names:
